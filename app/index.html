<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI Tracker — Management View</title>
<style>
/* ===================================================================
   MANAGEMENT KPI TRACKER — simple, read-only, plain language
   Colour means one thing only: something needs your attention.
   =================================================================== */
:root[data-theme="light"]{
  --bg:#F7F7F6; --panel:#FFFFFF; --panel2:#FBFBFA; --hover:#F2F2F0;
  --line:#E5E4E1; --line2:#D4D3CF;
  --tx:#1A1C1E; --tx2:#5C6268; --tx3:#8B9097;
  --acc:#2F5BD4; --acc-bg:#EAF0FE;
  --good:#2F7D54; --good-bg:#E9F4ED; --good-ln:#B9DCC8;
  --warn:#9B6A0C; --warn-bg:#FCF3E0; --warn-ln:#E9D4A0;
  --bad:#B03A32;  --bad-bg:#FBEDEB;  --bad-ln:#F0C7C1;
  --exc:#1A1C1E;  --exc-bg:#F0F0EE;  --exc-ln:#D4D3CF;
  --none:#8B9097; --none-bg:#F3F3F1;
  --sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px -8px rgba(0,0,0,.10);
  --sh2:0 2px 6px rgba(0,0,0,.06),0 20px 48px -12px rgba(0,0,0,.18);
}
:root[data-theme="dark"]{
  --bg:#0F1113; --panel:#16191C; --panel2:#1B1F22; --hover:#1F2428;
  --line:#262B30; --line2:#353B41;
  --tx:#E9EBED; --tx2:#9AA1A8; --tx3:#6B7278;
  --acc:#7D9BF7; --acc-bg:#1C2639;
  --good:#5FA47B; --good-bg:#152319; --good-ln:#2C4636;
  --warn:#D7A449; --warn-bg:#272014; --warn-ln:#4B3C1D;
  --bad:#E2726B;  --bad-bg:#2A1716;  --bad-ln:#4F2724;
  --exc:#E9EBED;  --exc-bg:#1F2428;  --exc-ln:#353B41;
  --none:#6B7278; --none-bg:#1A1D20;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px -8px rgba(0,0,0,.5);
  --sh2:0 2px 6px rgba(0,0,0,.5),0 20px 48px -12px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:14.5px;line-height:1.55;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  transition:background .15s,color .15s;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit;text-align:left}
input,select{font:inherit;color:inherit}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:5px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:7px;border:3.5px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:234px 1fr;height:100vh;height:100dvh;overflow:hidden}
.nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:17px 16px;border-bottom:1px solid var(--line)}
.bmark{width:28px;height:28px;border-radius:7px;background:var(--tx);display:grid;place-items:center;flex:none}
.bmark svg{color:var(--bg)}
.bname{font-size:14px;font-weight:650;letter-spacing:-.01em}
.bsub{font-size:11px;color:var(--tx3);margin-top:-1px}
.navs{flex:1;overflow-y:auto;padding:10px 9px}
.ngl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:13px 9px 6px}
.ni{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:7px;color:var(--tx2);font-size:13.5px;transition:background .12s,color .12s;position:relative}
.ni:hover{background:var(--hover);color:var(--tx)}
.ni.on{background:var(--hover);color:var(--tx);font-weight:600}
.ni.on::before{content:'';position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--tx);border-radius:0 3px 3px 0}
.ni svg{opacity:.7}.ni.on svg{opacity:1}
.nb{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--bad-bg);color:var(--bad)}
.nb.g{background:var(--good-bg);color:var(--good)}
.nb.m{background:var(--hover);color:var(--tx3)}
.nf{padding:11px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;background:var(--hover);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--tx2);flex:none}
.main{display:flex;flex-direction:column;overflow:hidden}

/* ============ TOP BAR ============ */
.top{display:flex;align-items:center;gap:8px;padding:0 20px;height:58px;flex:none;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:nowrap}
.test-mode-banner{display:flex;align-items:center;gap:10px;padding:9px 20px;background:var(--warn-bg);border-bottom:1px solid var(--warn-ln);color:var(--tx);font-size:12.5px;line-height:1.4;flex:none}
.test-mode-label{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;background:var(--warn);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.test-mode-banner .tm-copy{color:var(--tx2)}
.ctl{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;color:var(--tx);transition:border-color .12s,background .12s;white-space:nowrap}
.ctl:hover{border-color:var(--line2);background:var(--hover)}
.ctl.on{border-color:var(--acc);background:var(--acc-bg);color:var(--acc)}
.ctl .lb{color:var(--tx3);font-size:12px}
.ctl b{font-weight:600}
.ctl svg{color:var(--tx3)}
.sp{flex:1}
.tbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--tx2);border:1px solid transparent;transition:background .12s,border-color .12s}
.tbtn:hover{background:var(--hover);border-color:var(--line);color:var(--tx)}

/* dropdown panels */
.pop{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line2);border-radius:11px;box-shadow:var(--sh2);padding:7px;min-width:230px;display:none;max-height:76vh;overflow-y:auto}
.pop.on{display:block}
.pophd{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);padding:9px 10px 5px}
.popi{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:7px;font-size:13.5px;transition:background .12s}
.popi:hover{background:var(--hover)}
.popi.on{background:var(--acc-bg);color:var(--acc);font-weight:600}
.popi .mt{margin-left:auto;font-size:11.5px;color:var(--tx3)}
.popgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:2px 6px 6px}
.popdiv{height:1px;background:var(--line);margin:6px 8px}
.popgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:2px 6px 4px}
.popi.mo{justify-content:center;padding:9px 4px;font-weight:600}
.popi[disabled]{opacity:.32;cursor:not-allowed}
.popi[disabled]:hover{background:none}
.yrow{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px}
.yrow b{font-size:14px;font-weight:700;letter-spacing:-.01em}
.ybtn{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;color:var(--tx3);transition:background .12s}
.ybtn:hover{background:var(--hover);color:var(--tx)}
.ybtn:first-child svg{transform:rotate(90deg)} .ybtn:last-child svg{transform:rotate(-90deg)}
.popnote{font-size:11px;color:var(--tx3);padding:4px 10px 8px;text-align:center}
.rangebox{padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px}
.rangebox input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);font-size:13px;width:100%}
.searchin{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:13.5px;margin-bottom:5px}

/* ============ PAGE ============ */
.content{flex:1;overflow-y:auto}
.page{max-width:1340px;margin:0 auto;padding:26px 24px 80px}
.ph{margin-bottom:22px}
.pt{font-size:23px;font-weight:680;letter-spacing:-.022em;margin:0;display:flex;align-items:center;gap:9px}
.ps{font-size:14px;color:var(--tx2);margin-top:5px;max-width:720px;line-height:1.55}
.sec{margin-bottom:30px}
.sh{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.st{font-size:16px;font-weight:650;letter-spacing:-.012em;display:flex;align-items:center;gap:7px}
.sn{font-size:13px;color:var(--tx3)}
.slink{margin-left:auto;font-size:13px;color:var(--acc);font-weight:550;display:flex;align-items:center;gap:4px}
.slink:hover{text-decoration:underline}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.cp{padding:17px 18px}

/* ============ TOOLTIP ============ */
.tip{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1.3px solid var(--line2);color:var(--tx3);font-size:9.5px;font-weight:800;cursor:help;flex:none;vertical-align:middle;transition:border-color .12s,color .12s}
.tip:hover{border-color:var(--acc);color:var(--acc)}
#tipbox{position:fixed;z-index:200;max-width:308px;background:var(--tx);color:var(--bg);padding:10px 12px;border-radius:9px;font-size:12.8px;line-height:1.55;box-shadow:var(--sh2);pointer-events:none;opacity:0;transition:opacity .13s;letter-spacing:0}
#tipbox.on{opacity:1}
#tipbox b{font-weight:700}
#tipbox .hdr{font-weight:700;margin-bottom:3px;display:block}

/* ============ STATUS ============ */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 8px;border-radius:6px;font-size:11.5px;font-weight:680;letter-spacing:.01em;border:1px solid transparent;white-space:nowrap}
.badge .d{width:6px;height:6px;border-radius:50%;flex:none}
/* scoped to .badge only — these classes are also used on rows/cards for the left rule */
.badge.s-exceptional{color:var(--exc);background:var(--exc-bg);border-color:var(--exc-ln)}
.badge.s-exceptional .d{background:transparent;border:1.6px solid var(--exc);width:7px;height:7px}
.badge.s-ontrack{color:var(--good);background:var(--good-bg);border-color:var(--good-ln)}
.badge.s-ontrack .d{background:var(--good)}
.badge.s-attention{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-ln)}
.badge.s-attention .d{background:var(--warn)}
.badge.s-problem{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-ln)}
.badge.s-problem .d{background:var(--bad)}
.badge.s-nodata{color:var(--none);background:var(--none-bg);border:1px dashed var(--line2)}
.badge.s-nodata .d{background:transparent;border:1.4px dashed var(--none);width:8px;height:8px}

/* ============ TEAM CARDS (hero of Overview) ============ */
.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:13px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px 18px;cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .14s;position:relative;overflow:hidden}
.tcard:hover{border-color:var(--line2);box-shadow:var(--sh);transform:translateY(-1px)}
.tcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.tcard.s-problem::before{background:var(--bad)}
.tcard.s-attention::before{background:var(--warn)}
.tcard.s-ontrack::before{background:var(--good)}
.tcard.s-exceptional::before{background:var(--exc-ln)}
.tc-nm{font-size:13px;font-weight:620;color:var(--tx2);letter-spacing:.012em;text-transform:uppercase}
.tc-big{font-size:27px;font-weight:700;letter-spacing:-.028em;margin:11px 0 3px;line-height:1.05}
.tcard.s-problem .tc-big{color:var(--bad)}
.tcard.s-attention .tc-big{color:var(--warn)}
.tcard.s-ontrack .tc-big{color:var(--good)}
.tc-sub{font-size:13px;color:var(--tx2)}
.ppl{display:flex;gap:4px;margin:14px 0 3px;flex-wrap:wrap}
.pdot{width:21px;height:21px;border-radius:5px;display:grid;place-items:center;font-size:8.5px;font-weight:750;border:1px solid var(--line);background:var(--panel2);color:var(--tx3)}
.pdot.s-exceptional{border-color:var(--exc);color:var(--exc);background:var(--exc-bg)}
.pdot.s-ontrack{border-color:var(--good-ln);color:var(--good);background:var(--good-bg)}
.pdot.s-attention{border-color:var(--warn-ln);color:var(--warn);background:var(--warn-bg)}
.pdot.s-problem{border-color:var(--bad-ln);color:var(--bad);background:var(--bad-bg)}
.pdot.s-nodata{border-style:dashed}
.tc-ft{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--tx2);display:flex;gap:7px;align-items:flex-start;line-height:1.45}
.tc-ft b{color:var(--tx);font-weight:600}

/* ============ PERSON ROW (the core simple component) ============ */
.prow{display:flex;align-items:center;gap:15px;padding:15px 18px;border-bottom:1px solid var(--line);width:100%;transition:background .12s;position:relative}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--panel2)}
.prow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.prow.s-problem::before{background:var(--bad)}
.prow.s-attention::before{background:var(--warn)}
.prow.s-exceptional::before{background:var(--exc-ln)}
.pav{width:38px;height:38px;border-radius:9px;background:var(--hover);border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--tx2);flex:none}
.pmain{flex:1;min-width:0}
.pnm{font-size:14.5px;font-weight:620;letter-spacing:-.008em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prole{font-size:12.5px;color:var(--tx3);margin-top:1px}
.pkpi{font-size:13px;color:var(--tx2);margin-top:7px;line-height:1.5}
.pkpi b{color:var(--tx);font-weight:620}
.pnum{text-align:right;flex:none;min-width:116px}
.pnum .v{font-size:21px;font-weight:650;letter-spacing:-.022em;line-height:1.1;display:block}
.prow.s-problem .pnum .v{color:var(--bad)}
.prow.s-attention .pnum .v{color:var(--warn)}
.pnum .t{font-size:12px;color:var(--tx3);margin-top:3px;display:block}

/* actual vs expected bar — the key simple visual */
.vs{margin-top:22px;max-width:420px}
.vsbar{height:9px;border-radius:5px;background:var(--hover);position:relative;overflow:visible;border:1px solid var(--line)}
.vsfill{height:100%;border-radius:4px;background:var(--good);transition:width .5s cubic-bezier(.4,0,.2,1)}
.s-problem .vsfill{background:var(--bad)} .s-attention .vsfill{background:var(--warn)}
.s-exceptional .vsfill{background:var(--exc)} .s-nodata .vsfill{background:var(--none)}
.vsmark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tx);border-radius:2px}
.vsmark::after{content:attr(data-l);position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:650;color:var(--tx);white-space:nowrap;background:var(--panel);padding:0 4px}
.vslg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:7px}

/* ============ MONTH GRID (bonus) ============ */
.mgrid{width:100%;border-collapse:separate;border-spacing:0}
.mgrid th{font-size:11px;font-weight:650;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:11px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.mgrid th.l{text-align:left;padding-left:18px}
.mgrid td{padding:9px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.mgrid td.l{text-align:left;padding-left:18px}
.mgrid tr:last-child td{border-bottom:none}
.mgrid tbody tr:hover{background:var(--panel2)}
.mcell{width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--tx3);cursor:default}
.mcell.s-exceptional{border-color:var(--exc);background:var(--exc);color:var(--panel)}
.mcell.s-ontrack{border-color:var(--good-ln);background:var(--good-bg);color:var(--good)}
.mcell.s-attention{border-color:var(--warn-ln);background:var(--warn-bg);color:var(--warn)}
.mcell.s-problem{border-color:var(--bad-ln);background:var(--bad-bg);color:var(--bad)}
.mcell.s-nodata{border-style:dashed}
.starrow{background:var(--acc-bg)!important}
.pnamecell{display:flex;align-items:center;gap:11px}

/* ============ GENERIC BITS ============ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;font-size:13.5px;font-weight:550;border:1px solid var(--line);background:var(--panel);color:var(--tx);transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:var(--line2)}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn.pri:hover{opacity:.87}
.btn.sm{padding:6px 10px;font-size:12.5px}
.kv{display:grid;grid-template-columns:168px 1fr;gap:10px 14px;font-size:13.5px}
.kv dt{color:var(--tx3)} .kv dd{margin:0;line-height:1.5}
.note{display:flex;gap:10px;padding:13px 15px;border-radius:10px;background:var(--acc-bg);font-size:13.5px;line-height:1.55;align-items:flex-start}
.note svg{color:var(--acc);flex:none;margin-top:2px}
.note.w{background:var(--warn-bg)} .note.w svg{color:var(--warn)}
.note.b{background:var(--bad-bg)} .note.b svg{color:var(--bad)}
.note.g{background:var(--good-bg)} .note.g svg{color:var(--good)}
.stat{display:flex;flex-direction:column;gap:3px}
.stat .n{font-size:28px;font-weight:700;letter-spacing:-.028em;line-height:1}
.stat .l{font-size:12.5px;color:var(--tx3)}
.stat .sub{font-size:11.5px;color:var(--tx3);opacity:.85;margin-top:1px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.statrow>div{background:var(--panel);padding:16px 17px}
.statrow>div:last-child{grid-column:auto/-1}
.track{height:7px;border-radius:4px;background:var(--hover);overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;background:var(--good);transition:width .5s}
.track i.w{background:var(--warn)} .track i.b{background:var(--bad)} .track i.e{background:var(--exc)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;background:var(--hover);color:var(--tx2);font-size:11.5px;font-weight:550}
.tag.w{background:var(--warn-bg);color:var(--warn)} .tag.b{background:var(--bad-bg);color:var(--bad)}
.tag.g{background:var(--good-bg);color:var(--good)} .tag.a{background:var(--acc-bg);color:var(--acc)}

/* funnel */
.fn{display:flex;flex-direction:column;gap:3px}
.fs{display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:9px;transition:background .12s;position:relative}
.fs:hover{background:var(--panel2)}
.fs .nm{width:168px;flex:none;font-size:13.5px;font-weight:550}
.fs .bar{flex:1;height:26px;border-radius:6px;background:var(--hover);position:relative;overflow:hidden;min-width:60px}
.fs .bar i{display:block;height:100%;background:var(--tx3);opacity:.32;border-radius:6px;transition:width .5s}
.fs.stuck .bar i{background:var(--bad);opacity:.8}
.fs .ct{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:700;color:var(--tx)}
.fs .cv{width:112px;flex:none;text-align:right;font-size:12.5px;color:var(--tx3)}
.fs .cv b{color:var(--tx2);font-weight:620}
.fs.stuck .cv b{color:var(--bad)}

/* projection (early warnings) */
.proj{height:34px;border-radius:8px;background:var(--hover);position:relative;overflow:hidden;border:1px solid var(--line)}
.proj .now{position:absolute;left:0;top:0;bottom:0;background:var(--warn);opacity:.26}
.proj .tgtln{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--tx);border-radius:2px}
.proj .lbl{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;font-weight:650}
.lock{display:grid;place-items:center;padding:56px 24px;text-align:center}
.lockic{width:52px;height:52px;border-radius:14px;background:var(--hover);display:grid;place-items:center;color:var(--tx3);margin-bottom:15px}

table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}

function fmtClock(d){return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function fmtStamp(d){return d.toLocaleDateString('en-US',{day:'numeric',month:'short'})+', '+fmtClock(d);}
function agoText(d){
  const s=Math.floor((Date.now()-d.getTime())/1000);
  if(s<45)return 'just now';
  if(s<90)return '1 minute ago';
  const m=Math.floor(s/60); if(m<60)return m+' minutes ago';
  const h=Math.floor(m/60); return h===1?'1 hour ago':h+' hours ago';
}

function h32(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  h^=h>>>13;h=Math.imul(h,0x5bd1e995);h^=h>>>15;   /* finalizer — without this, strings
     that differ only in the last character land in the same narrow band */
  return (h>>>0)/4294967296;
}

const DAY=86400000;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const mondayOf=d=>{const x=new Date(d.getTime());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
function fmtRange(a,b){
  const sameY=a.getFullYear()===b.getFullYear(),sameM=sameY&&a.getMonth()===b.getMonth();
  const M=d=>d.toLocaleDateString('en-US',{month:'short'});
  if(a.getTime()===b.getTime())return `${a.getDate()} ${M(a)} ${a.getFullYear()}`;
  if(sameM)return `${a.getDate()} – ${b.getDate()} ${M(b)} ${b.getFullYear()}`;
  if(sameY)return `${a.getDate()} ${M(a)} – ${b.getDate()} ${M(b)} ${b.getFullYear()}`;
  return `${a.getDate()} ${M(a)} ${a.getFullYear()} – ${b.getDate()} ${M(b)} ${b.getFullYear()}`;
}
/* every preset in the top picker resolves to real dates */
function rangeFor(preset){
  const t=TODAY;
  const q=(n,y)=>[new Date(y,(n-1)*3,1),new Date(y,n*3,0)];
  switch(preset){
    case 'Today':        return [t,t];
    case 'Yesterday':    return [new Date(t-DAY),new Date(t-DAY)];
    case 'This week':    return [mondayOf(t),new Date(mondayOf(t).getTime()+6*DAY)];
    case 'Last week':    return [new Date(mondayOf(t)-7*DAY),new Date(mondayOf(t)-DAY)];
    case 'This month':   return [new Date(t.getFullYear(),t.getMonth(),1),new Date(t.getFullYear(),t.getMonth()+1,0)];
    case 'Last 30 days': return [new Date(t-29*DAY),t];
    case 'Q1 2026':return q(1,2026); case 'Q2 2026':return q(2,2026);
    case 'Q3 2026':return q(3,2026); case 'Q4 2026':return q(4,2026);
    case '2026':return [new Date(2026,0,1),new Date(2026,11,31)];
    case '2025':return [new Date(2025,0,1),new Date(2025,11,31)];
    default: return [S.dFrom,S.dTo];
  }
}
/* weekdays inside a range, never past the demo today (no data from the future) */
function workdaysBetween(a,b){
  const out=[],d=new Date(a.getTime()),end=b>TODAY?TODAY:b;
  while(d<=end){const w=d.getDay();if(w!==0&&w!==6)out.push(new Date(d.getTime()));d.setDate(d.getDate()+1);}
  return out;
}
/* a long range becomes one column per week instead of hundreds of days */
function bucketWeeks(days){
  const map=new Map();
  days.forEach((d,i)=>{
    const k=iso(mondayOf(d));
    if(!map.has(k))map.set(k,{start:mondayOf(d),idx:[]});
    map.get(k).idx.push(i);
  });
  return [...map.values()];
}
function applyRange(from,to,label){
  S.dFrom=from;S.dTo=to;

  S.dateSub=fmtRange(from,to);
}
const HITRATE={exceptional:.94,ontrack:.72,attention:.46,problem:.24,nodata:0};
function boardFor(p,days){
  const cfg=boardCfg(p);
  const n=3+Math.floor(h32('n|'+p.id)*4);              /* 3–6 rows */
  const start=Math.floor(h32('s|'+p.id)*CLIENTS.length);
  const rate=HITRATE[p.s]??.6;
  const accRate=rate>.8?.88:rate>.7?.8:rate>.4?.6:.35; /* strugglers also get rejected more */
  const rows=[];
  for(let c=0;c<n;c++){
    const name=CLIENTS[(start+c*3)%CLIENTS.length];
    const since=Math.floor(h32('j|'+p.id+'|'+name)*4); /* assigned a few days in */
    const cells=[];let hit=0,acc=0,active=0;
    days.forEach((d,x)=>{
      if(x<since||p.s==='nodata'){cells.push('na');return;}
      active++;
      if(h32(x+'|'+p.id+'|'+name)<rate){
        cells.push('hit');hit++;
        if(h32('a'+x+'|'+p.id+'|'+name)<accRate)acc++;
      } else cells.push('miss');
    });
    rows.push({name,cells,hit,acc,active});
  }
  return {cfg,rows,
    hit:rows.reduce((a,r)=>a+r.hit,0),
    acc:rows.reduce((a,r)=>a+r.acc,0),
    active:rows.reduce((a,r)=>a+r.active,0)};
}

function teamStat(name){
  const m=PEOPLE.filter(p=>p.team===name&&tracked(p));
  const scored=m.filter(p=>p.s!=='nodata');
  const bad=m.filter(p=>p.s==='problem').length;
  const warn=m.filter(p=>p.s==='attention').length;
  const ok=m.filter(p=>p.s==='ontrack'||p.s==='exceptional').length;
  const exc=m.filter(p=>p.s==='exceptional').length;
  let s='ontrack',label='ON TRACK';
  if(!scored.length){s='nodata';label='NO DATA'}
  else if(bad>0){s='problem';label='PROBLEM'}
  else if(warn>0){s='attention';label='WATCH'}
  else if(exc===m.length&&m.length>0){s='exceptional';label='EXCELLENT'}
  return {m,ok,bad,warn,exc,s,label,scored:scored.length};
}
function toast(msg,i='check'){
  const e=document.createElement('div');e.className='toast';e.innerHTML=ic(i,16,2)+`<span>${msg}</span>`;

}
/* actual vs expected bar */
function vsbar(p){
  const max=p.max||100;
  const w=Math.min(100,Math.max(1.5,(p.pct/max)*100));
  const t=Math.min(99,(p.tgt/max)*100);
  return `<div class="vs s-${p.s||'ontrack'}">
    <div class="vsbar"><div class="vsfill" style="width:${w}%"></div><div class="vsmark" style="left:${t}%" data-l="Target"></div></div>
    <div class="vslg"><span><b style="color:var(--tx);font-weight:650">${p.act}</b> actual</span><span>Expected: ${p.exp}</span></div>

}
/* downloads */
function csv(rows,name){
  const b=rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{
    const u=URL.createObjectURL(new Blob(['\ufeff'+b],{type:'text/csv;charset=utf-8;'}));
    const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
    a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
    toast(`Downloaded ${name}`,'check');
  }catch(e){toast('Download blocked in preview — works in a normal browser tab','info')}
}
/* live exports: real scores, not the mock-up columns */
function liveScoreCsv(list){
  const rows=[['Contractor','Role','Team','Overall score','KPI','KPI result','Basis']];

  });
  return rows;
}

/* ===================== 5. TEAMS & PEOPLE ===================== */
const SORTS={status:'Status — worst first',perf:'Performance vs target',cons:'Consistency — lowest first',name:'Name A–Z'};
const SRANK={problem:0,attention:1,nodata:2,ontrack:3,exceptional:4};
function perfRatio(p){
  if(p.s==='nodata'||!p.tgt||p.pct==null)return null;
  return p.lower? p.tgt/p.pct : p.pct/p.tgt;        /* <1 means below target */
}
function sortPeople(list){
  const a=[...list];
  if(S.sort==='status') a.sort((x,y)=>SRANK[x.s]-SRANK[y.s]||x.n.localeCompare(y.n));
  else if(S.sort==='cons') a.sort((x,y)=>(x.cons??999)-(y.cons??999)||x.n.localeCompare(y.n));
  else if(S.sort==='perf') a.sort((x,y)=>(perfRatio(x)??999)-(perfRatio(y)??999)||x.n.localeCompare(y.n));
  else a.sort((x,y)=>x.n.localeCompare(y.n));
  return a;
}

function peopleBoard(){
  const days=workdaysBetween(S.dFrom,S.dTo);
  const roles=[...new Set((effTeam()==='All teams'?PEOPLE.filter(tracked):PEOPLE.filter(p=>p.team===effTeam()&&tracked(p))).map(p=>p.role))].sort();
  if(!roles.includes(S.boardRole))S.boardRole=roles[0];
  let inRole=PEOPLE.filter(p=>p.role===S.boardRole&&tracked(p));
  if(effTeam()!=='All teams')inRole=inRole.filter(p=>p.team===effTeam());
  if(!inRole.length)return `<div class="sec">${emptyBox('Nobody in this role','Pick another job title or clear the team filter.')}</div>`;

  const cfg=boardCfg(inRole[0]);
  const sel=inRole.find(p=>p.id===S.boardPerson)||inRole[0];
  const pctCls=(a,b)=>!b?'':(a/b>=.8?'hi':a/b>=.55?'mid':'lo');
  const datePicker=`<button class="ctl" id="boardDateBtn" data-tip="Sets the dates this board covers. Pick a number of working days, a month or a quarter, or type exact dates." data-hdr="Board dates">${ic('cal',14,2)} <b>${S.boardPreset}</b> ${ic('chev',13,2.2)}</button>`;

  if(!days.length)return `<div class="sec"><div class="fbar">
      <span class="fl">${ic('cal',13,2)} Dates</span>${datePicker}</div></div>
    <div class="sec">${emptyBox('No working days in this range','The dates you picked are a weekend, or sit entirely in the future. Widen the range.')}</div>`;

  const bd=boardFor(sel,days);
  const rangeLbl=fmtRange(days[0],days[days.length-1]);
  /* one column per day is unreadable past about a month, so switch to weeks */
  const weekly=days.length>24;
  const cols=weekly?bucketWeeks(days):days.map((d,i)=>({d,idx:[i]}));
  const colHead=c=>weekly
    ? `<th><div class="dnum">${c.start.getDate()}</div><div class="dwk">${c.start.toLocaleDateString('en-US',{month:'short'})}</div></th>`
    : `<th><div class="dnum">${c.d.getDate()}</div><div class="dwk">${DOW[c.d.getDay()]}</div></th>`;
  /* roll a set of day cells up into one square */
  const roll=(cells,idx)=>{
    const a=idx.filter(i=>cells[i]!=='na');
    if(!a.length)return{st:'na',hit:0,act:0};
    const h=a.filter(i=>cells[i]==='hit').length;
    return{st:h/a.length>=.5?'hit':'miss',hit:h,act:a.length};
  };
  const colTip=(c,r)=>{
    if(!weekly)return `${r.name} — ${c.d.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'})}: ${r.cells[c.idx[0]]==='hit'?cfg.a.toLowerCase():r.cells[c.idx[0]]==='miss'?'nothing recorded':'not assigned yet'}`;
    const g=roll(r.cells,c.idx);
    return `${r.name} — week of ${c.start.toLocaleDateString('en-US',{day:'numeric',month:'long'})}: met on ${g.hit} of ${g.act} working days`;
  };

  return `
    <div class="sec">
      <div class="fbar">
        <span class="fl">${ic('cal',13,2)} Dates</span>
        ${datePicker}
        <span style="width:1px;height:22px;background:var(--line)"></span>
        <span class="fl">${ic('grid',13,2)} Job title</span>
        <button class="ctl" id="roleBtn" data-tip="Pick a job title. Everyone with that title is listed below, then you can open any one of them to see their day-by-day board." data-hdr="Job title"><b>${S.boardRole}</b> <span class="mt">${inRole.length}</span> ${ic('chev',13,2.2)}</button>
        <span style="font-size:12.5px;color:var(--tx3)">Measured on: <b style="color:var(--tx2)">${cfg.rule}</b></span>
        <div style="flex:1"></div>
        <button class="btn sm" data-exp="xls">${ic('xls',14,1.9)} Export board</button>
      </div>
    </div>

    <div class="sec">
      <div class="sh"><span class="st">Everyone who is a ${S.boardRole}</span>
        <span class="sn">${rangeLbl} · ${days.length} working day${days.length===1?'':'s'} · click a row to open their board</span></div>
      <div class="bwrap"><table class="bgrid">
        <thead><tr>
          <th class="cl">Person</th>
          <th style="text-align:left">Status</th>
          <th>${cfg.row}s</th>
          <th>${cfg.a}</th>
          <th>${cfg.b}</th>
          <th style="width:150px">Hit rate</th>
        </tr></thead>
        <tbody>${inRole.map(p=>{
          const b=boardFor(p,days);
          const pc=b.active?Math.round(b.hit/b.active*100):0;
          return `<tr class="rolerow ${p.id===sel.id?'on':''}" data-boardperson="${p.id}">
            <td class="cl"><div class="pnamecell"><div class="pav" style="width:30px;height:30px;font-size:10.5px">${p.i}</div>
              <div><div style="font-weight:620">${p.n}</div><div style="font-size:11.5px;color:var(--tx3)">${p.team}</div></div></div></td>
            <td style="text-align:left">${bdg(p.s)}</td>
            <td>${b.rows.length}</td>
            <td class="bsum ${pctCls(b.hit,b.active)}">${b.hit} <span style="color:var(--tx3);font-weight:400">of ${b.active}</span></td>
            <td class="bsum ${pctCls(b.acc,b.hit)}">${b.acc} <span style="color:var(--tx3);font-weight:400">of ${b.hit}</span></td>
            <td><div style="display:flex;align-items:center;gap:8px"><div class="track" style="flex:1"><i class="${pc>=80?'':pc>=55?'w':'b'}" style="width:${pc}%"></i></div><b style="font-size:12px;width:34px">${pc}%</b></div></td>
          </tr>`;}).join('')}</tbody>
      </table></div>
      ${hint('With a large role — 50 associates, for example — read this table first to see who needs a look, then open just that person below.')}
    </div>

    <div class="sec">
      <div class="sh"><span class="st">${sel.n} — ${weekly?'week by week':'day by day'}</span>
        <span class="sn">${bd.rows.length} ${cfg.row.toLowerCase()}s · ${rangeLbl} · ${weekly?cols.length+' weeks':days.length+' working days'}</span></div>

      <div class="card cp" style="padding:13px 16px;margin-bottom:13px">
        <div class="lgd" style="margin-top:0">
          <span style="font-weight:620;color:var(--tx2);font-size:12px;letter-spacing:.03em;text-transform:uppercase">How to read this</span>
          <span class="it"><span class="bcell hit">✓</span> <b>Met</b> — ${weekly?'met the KPI on most days that week':'they hit this KPI that day'}</span>
          <span class="it"><span class="bcell miss">✕</span> <b>Missed</b> — ${weekly?'missed on most days that week':'nothing recorded that day'}</span>
          <span class="it"><span class="bcell na">·</span> <b>Not assigned yet</b> — not counted either way</span>
        </div>
        ${weekly?hint('This range is longer than a month, so each square is one week — the date shown is the Monday. The two columns on the right still count individual days.'):''}
      </div>

      <div class="bwrap"><table class="bgrid">
        <thead><tr>
          <th class="cl">${cfg.row}</th>
          ${cols.map(colHead).join('')}
          <th class="sm">${cfg.a}</th>
          <th class="sm">${cfg.b}</th>
        </tr></thead>
        <tbody>
          ${bd.rows.map(r=>`<tr>
            <td class="cl"><b style="font-weight:600">${r.name}</b></td>
            ${cols.map(c=>{const st=weekly?roll(r.cells,c.idx).st:r.cells[c.idx[0]];
              return `<td><span class="bcell ${st}" data-tip="${colTip(c,r)}" data-hdr="${sel.n}">${st==='hit'?'✓':st==='miss'?'✕':'·'}</span></td>`;}).join('')}
            <td class="sm bsum ${pctCls(r.hit,r.active)}">${r.hit} <span style="color:var(--tx3);font-weight:400">of ${r.active}</span></td>
            <td class="sm bsum ${pctCls(r.acc,r.hit)}">${r.acc} <span style="color:var(--tx3);font-weight:400">of ${r.hit}</span></td>
          </tr>`).join('')}
          <tr style="border-top:2px solid var(--line2)">
            <td class="cl" style="font-weight:700">Total</td>
            ${cols.map(c=>{
              const sts=bd.rows.map(r=>weekly?roll(r.cells,c.idx).st:r.cells[c.idx[0]]);
              const n=sts.filter(x=>x==='hit').length,t=sts.filter(x=>x!=='na').length;
              const when=weekly?('Week of '+c.start.toLocaleDateString('en-US',{day:'numeric',month:'long'})):c.d.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'});
              return `<td><span style="font-size:11px;font-weight:650;color:${t&&n/t>=.6?'var(--good)':t&&n/t>0?'var(--warn)':'var(--tx3)'}" data-tip="${n} of ${t} ${cfg.row.toLowerCase()}s met" data-hdr="${when}">${t?n+'/'+t:'–'}</span></td>`;}).join('')}
            <td class="sm bsum ${pctCls(bd.hit,bd.active)}">${bd.hit} of ${bd.active}</td>
            <td class="sm bsum ${pctCls(bd.acc,bd.hit)}">${bd.acc} of ${bd.hit}</td>
          </tr>

      </div>
    </div>`;
}

function verdict(p){
  const run=excStreak(p);
  if(p.cons==null)return{t:'Not enough data yet',c:'none',d:'This person is in their ramp period or has no confirmed target, so there is no fair basis for a decision yet.'};
  if(p.cons>=92&&run>=3)return{t:'Strong case for a raise or promotion',c:'good',d:`Hit target in ${p.cons}% of the last 7 months and has been exceptional ${run} months in a row. Sustained, not a one-off.`};
  if(p.cons>=92)return{t:'Strong performer — recognition warranted',c:'good',d:`Hit target in ${p.cons}% of the last 7 months. Very reliable.`};
  if(p.cons>=84)return{t:'Solid — meeting expectations',c:'ok',d:`Hit target in ${p.cons}% of the last 7 months. No concerns, no special case for a raise on performance alone.`};
  if(p.cons>=70)return{t:'Inconsistent — watch',c:'warn',d:`Hit target in only ${p.cons}% of the last 7 months. Results swing month to month.`};
  return{t:'Performance concern',c:'bad',d:`Hit target in only ${p.cons}% of the last 7 months. Needs a documented conversation and a plan.`};
}

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* live "who this affects" preview inside the editor */
function kpiImpact(){
  const t=parseFloat((document.getElementById('ke_tgt')||{}).value);
  const lower=(document.getElementById('ke_lower')||{}).checked;
  document.querySelectorAll('[id^="imp_"]').forEach(el=>{
    const pct=parseFloat(el.dataset.pct);
    if(isNaN(pct)||isNaN(t)||!t){el.textContent='—';el.style.color='';return;}
    const okNow=lower? pct<=t : pct>=t;
    el.textContent=okNow?'on target':'below';
    el.style.color=okNow?'var(--good)':'var(--bad)';
  });
}
function saveKpi(id){
  const k=kById(id);if(!k)return;
  const g=i=>(document.getElementById(i)||{}).value;
  const before=k.tgt;
  k.n=g('ke_n')||k.n; k.what=g('ke_what'); k.role=g('ke_role')||k.role;
  k.tgt=parseFloat(g('ke_tgt')); k.max=parseFloat(g('ke_max'));
  { const e=parseFloat(g('ke_exc')); if(!isNaN(e))k.exc=e; }
  k.exp=g('ke_exp'); k.lower=!!document.getElementById('ke_lower').checked;
  k.bExc=g('ke_bExc'); k.bTgt=g('ke_bTgt'); k.bBelow=g('ke_bBelow');
  k.cadence=g('ke_cad'); k.source=g('ke_src'); k.note=g('ke_note');
  hydrate();
  document.getElementById('dw').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  renderTop();render();
  toast(before!==k.tgt?`${k.n} saved — target is now ${k.tgt}`:`${k.n} saved`,'check');
}
function setKpiStatus(id,st){
  const k=kById(id);if(!k)return;
  k.status=st;hydrate();
  const n=PEOPLE.filter(p=>p.kpi===id&&p.active!==false&&!p.removed).length;
  renderTop();render();
  toast(st==='active'?`${k.n} is live again — ${n} ${n===1?'person is':'people are'} being scored on it`
       :`${k.n} is now ${KSTAT[st].l.toLowerCase()} — ${n} ${n===1?'person':'people'} no longer scored`,
       st==='active'?'check':'clock');
}

/* ---- Early Warnings: trends in each person's completed weeks and months (the same history the Board shows) ---- */
const WARN_RANK={exceptional:3,ontrack:2,attention:1,problem:0};
function warnFlags(person){
  const flags=[];
  (person.series||[]).forEach(s=>{
    const done=s.cols.filter(c=>!c.inProgress&&c.key!=='nodata');
    if(done.length<2)return;
    const unit=s.grain==='week'?'week':'month';
    let streak=0;
    for(let i=done.length-1;i>=0&&WARN_RANK[done[i].key]<=1;i--)streak++;
    const last=done[done.length-1],prev=done[done.length-2];
    const recent=done.slice(-6);
    if(streak>=2){
      flags.push({kpi:s.kpi,kind:'Stuck below target',sev:streak>=(s.grain==='week'?4:3)?'High':'Medium',streak,recent,
        text:`Below target for ${streak} ${unit}s in a row (latest: ${last.label}).`});
    }else if(WARN_RANK[prev.key]>=2&&WARN_RANK[last.key]<=1){
      flags.push({kpi:s.kpi,kind:'Just slipped',sev:'Low',streak:1,recent,
        text:`Was ${ST[prev.key].l} in ${prev.label} and ${ST[last.key].l} in ${last.label}.`});
    }
  });
  return flags;
}

/* ================= KPI BONUS (live): exceptional months in a row ================= */
function nextMonthKey(m){const [y,mm]=m.split('-').map(Number);return mm===12?`${y+1}-01`:`${y}-${String(mm+1).padStart(2,'0')}`;}
function seriesMonth(c){return c.iso?String(c.iso).slice(0,7):/^\d{4}-\d{2}/.test(c.label)?String(c.label).slice(0,7):null;}
function lastDayOfMonth(m){const [y,mm]=m.split('-').map(Number);return iso(new Date(y,mm,0));}
function bonusMonths(){const max=boardToday().slice(0,7),out=[];for(let m=COUNT_FROM.slice(0,7);m<=max;m=nextMonthKey(m))out.push(m);return out;}
function monthComplete(m){return m<boardToday().slice(0,7)||boardToday()>=lastDayOfMonth(m);}
/* a month is rated by the lowest result among its completed weeks or months, so Exceptional means every counted period was Exceptional */
function monthRating(person,month){
  if(!monthComplete(month))return 'nodata';
  const keys=[];
  (person.series||[]).forEach(s=>s.cols.forEach(c=>{if(c.inProgress||c.key==='nodata')return;if(seriesMonth(c)===month)keys.push(c.key);}));
  return keys.length?keys.sort((a,b)=>SRANK[a]-SRANK[b])[0]:'nodata';
}
function bonusRun(person,months,upTo){
  let n=0;
  for(let i=months.indexOf(upTo);i>=0&&monthRating(person,months[i])==='exceptional';i--)n++;
  return n;
}

  t.setUTCDate(t.getUTCDate()-n+3);

  const wk=1+Math.round(((t-first)/DAY-3+((first.getUTCDay()+6)%7))/7);

async function loadSlowKpis(force,seqArg){

    get('/api/kpi/valuation-output'+q).then(d=>{DATA.valuationOutput={data:d,error:null,loading:false};}).catch(e=>{DATA.valuationOutput={data:null,error:e.message,loading:false};}),
    get('/api/kpi/team-sourcing-health'+q).then(d=>{DATA.teamHealth={data:d,error:null,loading:false};}).catch(e=>{DATA.teamHealth={data:null,error:e.message,loading:false};}),
    get('/api/kpi/closing-agreements'+q).then(d=>{DATA.closing={data:d,error:null,loading:false};}).catch(e=>{DATA.closing={data:null,error:e.message,loading:false};}),
    get('/api/kpi/conversion'+q).then(d=>{DATA.conversion={data:d,error:null,loading:false};}).catch(e=>{DATA.conversion={data:null,error:e.message,loading:false};}),
    get('/api/kpi/team-loi-closing'+q).then(d=>{DATA.teamLoiClosing={data:d,error:null,loading:false};}).catch(e=>{DATA.teamLoiClosing={data:null,error:e.message,loading:false};}),
    get('/api/kpi/onboarding'+q).then(d=>{DATA.onboarding={data:d,error:null,loading:false};}).catch(e=>{DATA.onboarding={data:null,error:e.message,loading:false};}),
    get('/api/kpi/time-to-fill'+q).then(d=>{DATA.timeToFill={data:d,error:null,loading:false};}).catch(e=>{DATA.timeToFill={data:null,error:e.message,loading:false};}),
    get('/api/kpi/audits'+q).then(d=>{DATA.audits={data:d,error:null,loading:false};}).catch(e=>{DATA.audits={data:null,error:e.message,loading:false};})
  ]);

}

/* Board status for the picked dates: per KPI, the latest finished week or month that falls in the dates; the worst of those KPIs.
   Without any weekly or monthly results (daily-only job titles) it stays the overall score. */
function boardStatusKey(p,days){
  const series=p.series||[];
  if(!series.length||!days.length)return p.s||'nodata';
  const from=days[0],to=days[days.length-1],keys=[];
  series.forEach(x=>{
    let best=null;
    x.cols.forEach(c=>{
      let a=null,b=null;
      if(x.grain==='week'){if(c.iso){a=isoMonday(c.iso);b=addIsoDays(a,6);}}
      else if(/^\d{4}-\d{2}$/.test(c.label)){a=c.label+'-01';b=c.label+'-31';}
      else if(/^\d{4}-\d{2}-\d{2}$/.test(c.label)){a=b=c.label;}
      if(!a||b<from||a>to||c.inProgress)return;
      if(!best||a>best.a)best={a,key:c.key};
    });
    if(best&&best.key!=='nodata')keys.push(best.key);
  });
  return keys.length?keys.sort((a,b)=>SRANK[a]-SRANK[b])[0]:'nodata';
}

function liveBoardCsv(){
  const rg=boardRange();
  const {inRole}=boardRows();

  const first=[...models.values()].find(Boolean);
  const out=[['Job title: '+(S.boardRole||''),`From ${rg.from} to ${rg.to}`,winText()]];
  if(first){
    out.push(['Measured on: '+first.rule]);
    out.push([]);
    out.push(['Contractor','Overall score','KPI',...first.sums.map(s=>s.h),'Hit','Of','Hit rate %']);
    inRole.forEach(p=>{const m=models.get(p.id);out.push([p.n,ST[p.s||'nodata'].l,m?m.kpi:'',...first.sums.map((s,i)=>m&&m.sums[i]?m.sums[i].v:''),m&&m.of?m.hit:'',m&&m.of?m.of:'',m&&m.of?Math.round(m.hit/m.of*100):'']);});
    inRole.forEach(p=>{const m=models.get(p.id);if(!m)return;
      out.push([]);out.push([p.n+' - '+m.kpi]);out.push([m.rowHead,...rg.days,m.totHead]);
      m.rows.forEach(r=>out.push([r.label,...r.cells.map(c=>c.s==='hit'?'Met':c.s==='miss'?'Missed':''),r.tot]));});
  }
  const rows=boardRows().rows;
  ['week','month'].forEach(grain=>{
    const part=rows.filter(r=>r.x&&r.x.grain===grain);if(!part.length||first)return;
    const cols=boardCols(part);
    out.push([]);out.push(['Contractor','Overall score','KPI',...cols.map(c=>(grain==='week'?'Week of ':'Period ending ')+c)]);
    part.forEach(r=>{const by=new Map(r.x.cols.map(c=>[c.label,c]));out.push([r.p.n,ST[r.p.s||'nodata'].l,r.x.kpi,...cols.map(l=>{const c=by.get(l);return c?(c.inProgress?'In progress':ST[c.key].l):'';})]);});
  });
  const none=rows.filter(r=>!r.x&&!models.get(r.p.id)).map(r=>r.p);
  if(none.length&&!first){out.push([]);out.push(['No history to show']);none.forEach(p=>out.push([p.n,ST[p.s||'nodata'].l]));}
  return out;
}

    const pipeline=pipelineResult.status==='fulfilled'?pipelineResult.value:null;
    const fetchedUsers=usersResult.status==='fulfilled'?usersResult.value.users:[];
    const users=[...new Map(fetchedUsers.map(user=>[String(user.id),user])).values()];
    const errors=[];
    for(const [label,result] of [['Connection',testResult],['Pipeline',pipelineResult],['Contractors',usersResult]]){
      if(result.status==='rejected')errors.push(`${label}: ${result.reason.message}`);
      else if(result.value.stale)errors.push(`${label}: showing cached data after a refresh error`);
    }
    if(pipeline&&!pipeline.complete)errors.push(`Deals: retrieved ${pipeline.fetchedDeals} of ${pipeline.totalDeals}`);

    if(usersResult.status==='fulfilled'){
      PEOPLE.splice(0,PEOPLE.length,...users.map(user=>{
        const name=user.name||`Bitrix user ${user.id}`;
        const originalTitle=user.title||'';
        const initials=name.trim().split(/\s+/).slice(0,2).map(part=>part[0]||'').join('').toUpperCase();
        return {id:`bitrix-${String(user.id).replace(/[^0-9]/g,'')}`,bitrixId:String(user.id),bitrixTitle:originalTitle,
          departmentIds:Array.isArray(user.departmentIds)?[...new Set(user.departmentIds.map(String))]:[],
          departmentNames:Array.isArray(user.departments)?user.departments:[],kpi:null,active:true,
          n:name,i:initials||'U',role:originalTitle||'Title not set',team:teamForWorkPosition(originalTitle),s:'nodata',k:'No verified KPI mapping',
          what:'No verified KPI-to-Bitrix field mapping is available.',exp:'No Data',act:'No Data',pct:null,tgt:null,max:100,
          since:'—',why:'No performance score is calculated from the current Bitrix fields.',
          hist:MONTHS.map(()=> 'nodata'),cons:null};
      }).filter(person=>person.team!==UNMAPPED_TEAM));   /* contractors with no official team are hidden */
      const teamCounts=new Map(OFFICIAL_TEAMS.map(team=>[team,0]));
      PEOPLE.forEach(person=>teamCounts.set(person.team,(teamCounts.get(person.team)||0)+1));
      TEAMS.splice(0,TEAMS.length,...[...teamCounts].map(([name,size])=>({n:name,size,tip:'Role mapped from Bitrix WORK_POSITION'})));
      USERS.splice(0,USERS.length,...PEOPLE.map(person=>({n:person.n,r:person.role,a:'Read-only dashboard',bitrixId:person.bitrixId})));
    }
    if(pipeline?.complete){
      const sorted=[...pipeline.stages].sort((a,b)=>String(a.categoryId).localeCompare(String(b.categoryId),undefined,{numeric:true})||a.sort-b.sort);
      PIPE.splice(0,PIPE.length,...sorted.map(stage=>({n:stage.name,c:stage.count,cv:null,
        categoryId:stage.categoryId,categoryName:stage.categoryName,stageId:stage.id,type:stage.type})));
    }

    const hasData=(pipeline?.complete)||usersResult.status==='fulfilled';
    const connected=testResult.status==='fulfilled'&&pipeline?.complete&&usersResult.status==='fulfilled';
    DATA.mode=hasData?'live':'unavailable';
    DATA.error=errors.join(' · ');
    DATA.generatedAt=hasData?new Date().toISOString():DATA.generatedAt;
    DATA.bitrix={connected,deals:pipeline?.fetchedDeals??null,totalDeals:pipeline?.totalDeals??null,
      stages:pipeline?.complete?pipeline.stages.length:null,
      employees:usersResult.status==='fulfilled'?users.length:null,
      stale:!!(pipeline?.stale||(usersResult.status==='fulfilled'&&usersResult.value.stale)),error:DATA.error};
    SOURCES[0]={...SOURCES[0],ok:connected,last:hasData?fmtStamp(new Date()):'Not synced'};
    SOURCES[1]={...SOURCES[1],ok:DATA.sheets.connected,last:DATA.sheets.connected?fmtStamp(new Date()):'Not connected',
      note:DATA.sheets.connected?'Deal Operations KPI Tracker (read-only).':'Not connected to this dashboard.'};
    SOURCES[2]={...SOURCES[2],ok:DATA.notion.connected,last:DATA.notion.connected?fmtStamp(new Date()):'Not connected',
      note:DATA.notion.connected?'Auditing Reports, Process Improvements and Applicant Status (read-only).':'Not connected to this dashboard.'};
    if(hasData){S.lastRefresh=new Date();S.cached=false;}
    if(connected)toast(`Bitrix connected — ${pipeline.fetchedDeals.toLocaleString()} deals, ${users.length} contractors`,'check');
    else toast(errors[0]||'Bitrix data is incomplete','warn');
    return connected;
  }catch(error){
    DATA.mode='unavailable';DATA.error=error.message;
    DATA.bitrix={...DATA.bitrix,connected:false,error:error.message};
    toast(error.message,'warn');
    return false;
  }finally{
    S.refreshing=false;
    computeAllScores();
    sourceBadge();renderTop();render();
    loadSlowKpis(force);
  }
}

/* ---- Saved copy of the last good load: shown straight away on reload while Bitrix is read again ---- */
const CACHE_KEY='kt.cache.v1';
function saveCache(){
  if(WIN.explicit||DATA.mode!=='live'||!PEOPLE.length||slowStillLoading())return;
  try{
    const slow={};
    SLOW_KEYS.forEach(k=>{if(DATA[k]&&DATA[k].data)slow[k]=DATA[k].data;});
    localStorage.setItem(CACHE_KEY,JSON.stringify({saved:Date.now(),last:S.lastRefresh?+S.lastRefresh:null,
      cf:COUNT_FROM,ct:COUNT_TO,cs:COUNT_START,bitrix:BITRIX,
      people:PEOPLE,teams:TEAMS.map(t=>({n:t.n,size:t.size,tip:t.tip})),pipe:PIPE,users:USERS,
      signedLois:DATA.signedLois.data,taskKpis:DATA.taskKpis.data,notionKpi:DATA.notionKpi,sheets:DATA.sheets,slow}));
  }catch(e){try{localStorage.removeItem(CACHE_KEY);}catch(e2){}}  /* too big or blocked: better no copy than an old one */
}
function restoreCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY);if(!raw)return false;
    const c=JSON.parse(raw);
    if(!c||!Array.isArray(c.people)||!c.people.length)return false;
    COUNT_FROM=c.cf;COUNT_TO=c.ct;COUNT_START=c.cs;if(c.bitrix)BITRIX=c.bitrix;
    WIN=initialWindow();S.date=WIN.label;S.dateSub=winText();
    PEOPLE.splice(0,PEOPLE.length,...c.people);TEAMS.splice(0,TEAMS.length,...c.teams);
    PIPE.splice(0,PIPE.length,...c.pipe);USERS.splice(0,USERS.length,...c.users);
    DATA.signedLois={data:c.signedLois||null,error:null};DATA.taskKpis={data:c.taskKpis||null,error:null};
    if(c.notionKpi)DATA.notionKpi=c.notionKpi;if(c.sheets)DATA.sheets=c.sheets;
    SLOW_KEYS.forEach(k=>{DATA[k]={data:c.slow&&c.slow[k]||null,error:null,loading:false};});
    DATA.mode='live';DATA.generatedAt=new Date(c.saved).toISOString();
    S.lastRefresh=new Date(c.last||c.saved);S.cached=true;
    hydrate();computeAllScores();
    return true;
  }catch(e){try{localStorage.removeItem(CACHE_KEY);}catch(e2){}return false;}
}

  const r=t.getBoundingClientRect(),w=tb.offsetWidth,h=tb.offsetHeight;
  let x=r.left+r.width/2-w/2,y=r.top-h-9;
  if(y<8)y=r.bottom+9;

  tb.style.left=x+'px';tb.style.top=y+'px';
}

document.addEventListener('click',e=>{

    tb.innerHTML=(t.dataset.hdr?`<span class="hdr">${t.dataset.hdr}</span>`:'')+t.dataset.tip;
    tb.classList.add('on');moveTip(t);
    setTimeout(()=>tb.classList.remove('on'),3400);
  }
});

    applyRange(f,t);S.boardPreset=fmtRange(f,t);
    hidePop();renderTop();render();
    toast(`Board showing ${fmtRange(f,t)}`,'cal');return;}
  if(g('#expBtn')){showPop(g('#expBtn'),expPop());return;}
  if(g('#applyRange')){
    const a=document.getElementById('d1').value,b=document.getElementById('d2').value;
    if(!a||!b){toast('Pick both a start and an end date','info');return;}
    let f=parseISO(a),t=parseISO(b);
    if(f>t){const s=f;f=t;t=s;}
    applyRange(f,t);S.boardPreset=fmtRange(f,t);
    hidePop();renderTop();render();toast(`Showing ${fmtRange(f,t)}`,'cal');return;}
  if(g('#dwx2')){document.getElementById('dw').classList.remove('on');document.getElementById('scrim').classList.remove('on');return;}

  const el=g('[data-lbsort],[data-qwin],[data-lbmonth],[data-lbpreset],[data-nav],[data-date],[data-cmp],[data-team],[data-team2],[data-person],[data-person2],[data-month],[data-byear],[data-exp],[data-expperson],[data-demo],[data-jump],[data-clearf],[data-sort],[data-pmode],[data-brole],[data-boardperson],[data-guide],[data-bdate],[data-editkpi],[data-kstat],[data-ksave],[data-kedit],[data-deact],[data-react],[data-rm]');
  if(!el){if(!g('#pop'))hidePop();return;}

  /* overview stat -> the list of people behind that number */

    S.view=d.jump;

  if(d.clearf){S.team='All teams';S.person='All people';S.statusFilter=null;S.search='';render();renderTop();return;}
  if(d.nav){S.view=d.nav;S.search='';S.statusFilter=null;document.getElementById('content').scrollTop=0;renderTop();render();hidePop();return;}

        const [f,t]=BPRESETS['Last 15 working days']();
        applyRange(f,t,'Last 15 working days');S.boardPreset='Last 15 working days';

  if(d.expperson){exportPerson(d.expperson);hidePop();return;}

  if(d.editkpi){openKpiEditor(d.editkpi);return;}
  if(d.kstat){const [id,st]=d.kstat.split(':');setKpiStatus(id,st);return;}
  if(d.ksave){saveKpi(d.ksave);return;}
  if(d.kedit){                                  /* status buttons inside the editor */
    const [f,val]=d.kedit.split(':');
    if(f==='status'){const id=document.querySelector('[data-ksave]').dataset.ksave;
      kById(id).status=val;openKpiEditor(id);}
    return;}
  /* ---- admin: roster ---- */
  if(d.deact){
    const p=PEOPLE.find(x=>x.id===d.deact);if(!p)return;
    p.active=false;p.offDate=fmtRange(TODAY,TODAY);S.confirmRemove=null;
    renderTop();render();
    toast(`${p.n} deactivated — removed from every number, history kept`,'check');return;}
  if(d.react){
    const p=PEOPLE.find(x=>x.id===d.react);if(!p)return;
    p.active=true;delete p.offDate;S.confirmRemove=null;
    renderTop();render();toast(`${p.n} reactivated`,'check');return;}
  if(d.rm){
    if(S.confirmRemove!==d.rm){S.confirmRemove=d.rm;render();
      toast('Click again to delete this person and their history','warn');return;}
    const p=PEOPLE.find(x=>x.id===d.rm);if(!p)return;
    p.removed=true;p.active=false;S.confirmRemove=null;
    renderTop();render();toast(`${p.n} removed from the roster`,'check');return;}
  if(d.demo){toast(d.demo,'check');return;}
});

/* ===================== DATA LAYER =====================
   The whole app reads from the arrays below. In the shipped prototype they hold
   sample figures. In production a scheduled job writes ./data/snapshot.json and
   this loader swaps the real numbers in before the first paint. Nothing else in
   the app knows or cares where the data came from — that is the entire point.
   The accepted shape is documented in data/snapshot.example.json.            */
async function loadSnapshot(){
  return syncBitrix(false);
}
function applySnapshot(d){
  const swap=(arr,rows)=>{ if(Array.isArray(rows)){arr.length=0;for(const r of rows)arr.push(r);} };
  if(!Array.isArray(d.people)||!Array.isArray(d.kpis))
    throw new Error('people[] and kpis[] are required');

  if(d.today) TODAY=typeof d.today==='string'?parseISO(d.today):new Date(d.today);
  else TODAY=new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());

  swap(KPIS,d.kpis); swap(PEOPLE,d.people); swap(PIPE,d.pipeline);
  swap(WARN,d.warnings); swap(KCHK,d.kpiCheck); swap(USERS,d.users);
  if(Array.isArray(d.sources)) SOURCES=d.sources;
  if(Array.isArray(d.months)&&d.months.length) swap(MONTHS,d.months);

  /* teams keep their live headcount getter, so only name + lead come from the feed */
  if(Array.isArray(d.teams)&&d.teams.length){
    TEAMS.length=0;
    for(const t of d.teams)TEAMS.push({n:t.n,lead:t.lead,
      get size(){return PEOPLE.filter(p=>p.team===this.n&&tracked(p)).length;}});
  }
  /* the default window has to be recomputed against the real today */
  const [f,t]=rangeFor(S.date); S.dFrom=f; S.dTo=t; S.dateSub=fmtRange(f,t);
  hydrate();
}
function sourceBadge(){
  const el=document.getElementById('bsub'); if(!el)return;
  const connected=DATA.bitrix.connected;
  const label=connected?'Live Bitrix':DATA.mode==='connecting'?'Connecting':'No live data';
  const detail=connected?'Deals, stages, and contractors':DATA.error||'The backend connection has not been confirmed.';
  el.innerHTML=`Management view<br><span class="dchip ${connected?'live':'sample'}" data-tip="${liveEscape(detail)}" data-hdr="${connected?'Live data':'Connection status'}"><i></i>${label}</span>`;
}
function timeAgo(d){
  const s=Math.max(0,(Date.now()-d.getTime())/1000);
  if(s<90)return 'just now';
  if(s<5400)return Math.round(s/60)+' min ago';
  if(s<172800)return Math.round(s/3600)+' hours ago';
  return Math.round(s/86400)+' days ago';
}

/* ===================== BOOT ===================== */
function boot(){
  S.theme=store.g('kt.theme','light');
  document.documentElement.setAttribute('data-theme',S.theme);
  if(innerWidth<680)S.view='overview';
  PEOPLE.splice(0);TEAMS.splice(0);PIPE.splice(0);WARN.splice(0);USERS.splice(0);
  SOURCES.forEach(source=>{source.ok=false;source.last='Not synced';});
  hydrate();
  restoreCache();
  render();
  loadSnapshot();
}
/* the server only serves this page after login; it tells us which password was used */

    S.admin=s.role==='admin';
    document.getElementById('roleAv').textContent=S.admin?'AD':'CO';
    document.getElementById('roleName').textContent=S.admin?'Admin':'Contractor';
    document.getElementById('roleSub').textContent=S.admin?'Full access':'View only';
    boot();})
  .catch(()=>{location.href='/login';});
